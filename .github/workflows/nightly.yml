# Publishes the rolling "nightly" pre-release from main, built against upstream
# LimeSuiteNG develop. Runs when a pull request is merged, and on a daily
# schedule to pick up upstream changes; the schedule skips when nothing changed.
name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      upstream: ${{ steps.decide.outputs.upstream }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source native/versions.env
          upstream="$(git ls-remote "$LIMESUITENG_REPOSITORY" refs/heads/develop | cut -f1)"
          if [ -z "$upstream" ]; then
            echo "::error::Unable to read LimeSuiteNG develop"
            exit 1
          fi
          marker="Built from ${GITHUB_SHA} and LimeSuiteNG ${upstream}"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
             gh release view nightly --json body --jq .body 2>/dev/null | grep -qF "$marker"; then
            build=false
          fi
          {
            echo "build=$build"
            echo "upstream=$upstream"
            echo "version=${LIMESUITENG_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      limesuiteng_ref: ${{ needs.prepare.outputs.upstream }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          (cd jars && sha256sum *.jar > SHA256SUMS)
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly jars/* --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of main. Not for production use.

          Built from ${GITHUB_SHA} and LimeSuiteNG ${UPSTREAM}"
